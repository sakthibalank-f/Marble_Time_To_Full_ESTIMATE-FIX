# Marble Time-To-Full Fix - settings (sourced by service.sh, plain sh syntax)

# Raw time_to_full_now is multiplied by this to get seconds.
# 60 = fuel gauge reports minutes (marble default).
# Set to 1 if the raw value is already in seconds (then this module does nothing useful).
MULT=60

# Anything above this many seconds after conversion is treated as garbage and
# reported as "unknown" (-1), so Android falls back to its own estimate.
# 21600 = 6 hours. This also protects you if the raw value was really seconds.
CAP=21600

# Seconds between updates while charging (idle polling is 30s).
INTERVAL=5
